services:
  copilot:
    build:
      context: ../apps/copilot
      dockerfile: Dockerfile
    volumes:
      - ../apps/copilot/src:/app/src:cached
      - ../apps/copilot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["copilot", "serve", "--reload"]

  job-worker:
    build:
      context: ../apps/copilot
      dockerfile: Dockerfile
    volumes:
      - ../apps/copilot/src:/app/src:cached
      - ../apps/copilot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["copilot", "job-worker"]

  job-scheduler:
    build:
      context: ../apps/copilot
      dockerfile: Dockerfile
    volumes:
      - ../apps/copilot/src:/app/src:cached
      - ../apps/copilot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["copilot", "job-scheduler"]

  thing-indexer:
    build:
      context: ../apps/copilot
      dockerfile: Dockerfile
    volumes:
      - ../apps/copilot/src:/app/src:cached
      - ../apps/copilot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["copilot", "thing-indexer"]

  chat-ui:
    build:
      context: ../apps/chat-ui
      dockerfile: Dockerfile
      target: dev
      args:
        APP_VERSION: ${APP_VERSION:-}
    volumes:
      - ../apps/chat-ui/src:/app/src:cached
      - ../apps/chat-ui/public:/app/public:cached
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_POLL_INTERVAL_MS: "1000"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "1"

  code-executor:
    build:
      context: ../apps/code-executor
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8888:8888"
    volumes:
      - ../apps/code-executor/code_executor:/app/code_executor:cached
    environment:
      LOG_LEVEL: "DEBUG"
      IDLE_TIMEOUT_SECONDS: "600"
    entrypoint: ["uvicorn", "code_executor.api:app", "--host", "0.0.0.0", "--port", "8888", "--reload", "--reload-dir", "code_executor"]

  wot-runtime:
    build:
      context: ../apps/wot-runtime
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ../apps/wot-runtime:/app:cached
      - /app/node_modules
    command: ["npx", "tsx", "watch", "src/index.ts"]
