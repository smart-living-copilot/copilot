[alembic]
# Resolve relative to this file so the migrations are found regardless of the
# current working directory or whether ``copilot`` is imported from a source
# checkout or installed into site-packages. ``%(here)s`` is the directory of
# this config file (i.e. the ``copilot`` package root).
script_location = %(here)s/migrations
# Put the package's parent (the ``src`` dir in a source checkout) on sys.path so
# the standalone ``alembic`` CLI can import ``copilot`` without an editable
# install. Harmless when already installed.
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
