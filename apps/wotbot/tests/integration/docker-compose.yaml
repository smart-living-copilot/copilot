services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: wotbot_test
      POSTGRES_USER: wotbot
      POSTGRES_PASSWORD: wotbot
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wotbot -d wotbot_test"]
      interval: 1s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
