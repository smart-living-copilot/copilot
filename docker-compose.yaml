services:
  copilot:
    image: ghcr.io/smart-living-copilot/copilot:latest
    env_file: .env
    volumes:
      - copilot-data:/data
    environment:
      WOT_REGISTRY_URL: "${WOT_REGISTRY_URL:-http://copilot:8123}"
      WOT_REGISTRY_TOKEN: "${INIT_ADMIN_TOKEN}"
      CODE_EXECUTOR_URL: "http://code-executor:8888"
      JOB_RUNNER_URL: "http://copilot:8123"
      JOBS_ENABLED: "${JOBS_ENABLED:-true}"
      REDIS_URL: "redis://valkey:6379"
      WOT_RUNTIME_URL: "http://wot-runtime:3003"
      WOT_RUNTIME_API_TOKEN: "${WOT_RUNTIME_API_TOKEN}"
      WOT_RUNTIME_STREAM: "${WOT_RUNTIME_STREAM:-wot_runtime_events}"
      REGISTRY_DATABASE_URL: "${REGISTRY_DATABASE_URL:-postgresql://copilot:copilot@postgres:5432/copilot}"
      AGENT_STATE_DATABASE_URL: "${AGENT_STATE_DATABASE_URL:-}"
      REGISTRY_PUBLIC_URL: "${REGISTRY_PUBLIC_URL:-http://copilot:8123}"
      INIT_ADMIN_TOKEN: "${INIT_ADMIN_TOKEN}"
      WOT_RUNTIME_REGISTRY_TOKEN: "${WOT_RUNTIME_REGISTRY_TOKEN}"
      SEARCH_VECTOR_DIMENSIONS: "${SEARCH_VECTOR_DIMENSIONS:-1024}"
      THING_EVENT_OUTBOX_BATCH_SIZE: "${THING_EVENT_OUTBOX_BATCH_SIZE:-20}"
      THING_EVENT_OUTBOX_POLL_INTERVAL_SECONDS: "${THING_EVENT_OUTBOX_POLL_INTERVAL_SECONDS:-0.5}"
      OPENAI_EMBEDDING_API_BASE_URL: "${OPENAI_EMBEDDING_API_BASE_URL:-}"
      OPENAI_EMBEDDING_API_KEY: "${OPENAI_EMBEDDING_API_KEY:-}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-}"
      WOT_RUNTIME_TIMEOUT_SECONDS: "${WOT_RUNTIME_TIMEOUT_SECONDS:-15}"
      WOT_RUNTIME_SUBSCRIPTION_TIMEOUT_SECONDS: "${WOT_RUNTIME_SUBSCRIPTION_TIMEOUT_SECONDS:-5}"
      WOT_SUBSCRIPTION_SETUP_TIMEOUT_MS: "${WOT_SUBSCRIPTION_SETUP_TIMEOUT_MS:-0}"
      JOBS_EVENTS_GROUP: "${JOBS_EVENTS_GROUP:-job_runner}"
      JOBS_EVENTS_CONSUMER: "${JOBS_EVENTS_CONSUMER:-job_runner_1}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL}"
      OPENAI_BASE_URL: "${OPENAI_API_BASE_URL}"
      MEDIA_RTC_CONFIGURATION: "${MEDIA_RTC_CONFIGURATION:-}"
      MEDIA_SERVER_RTC_CONFIGURATION: "${MEDIA_SERVER_RTC_CONFIGURATION:-}"
      MEDIA_ICE_GATHER_TIMEOUT_MS: "${MEDIA_ICE_GATHER_TIMEOUT_MS:-750}"
      STT_ENABLED: "${STT_ENABLED:-false}"
      STT_TRANSCRIPTIONS_URL: "${STT_TRANSCRIPTIONS_URL:-}"
      STT_MODEL: "${STT_MODEL:-whisper-large-turbo}"
      STT_API_KEY: "${STT_API_KEY:-}"
      STT_LANGUAGE: "${STT_LANGUAGE:-}"
      STT_TIMEOUT_SECONDS: "${STT_TIMEOUT_SECONDS:-30}"
      STT_SUBMIT_TO_CHAT: "${STT_SUBMIT_TO_CHAT:-true}"
      VAD_THRESHOLD: "${VAD_THRESHOLD:-0.65}"
      VAD_MIN_SPEECH_MS: "${VAD_MIN_SPEECH_MS:-400}"
      VAD_MIN_SILENCE_MS: "${VAD_MIN_SILENCE_MS:-800}"
      VAD_SPEECH_PAD_MS: "${VAD_SPEECH_PAD_MS:-200}"
      VAD_MAX_UTTERANCE_MS: "${VAD_MAX_UTTERANCE_MS:-20000}"
      TTS_ENABLED: "${TTS_ENABLED:-false}"
      TTS_SPEECH_URL: "${TTS_SPEECH_URL:-http://kokoro-tts:8880/v1/audio/speech}"
      TTS_MODEL: "${TTS_MODEL:-kokoro}"
      TTS_VOICE: "${TTS_VOICE:-af_heart}"
      TTS_API_KEY: "${TTS_API_KEY:-}"
      TTS_RESPONSE_FORMAT: "${TTS_RESPONSE_FORMAT:-pcm}"
      TTS_SPEED: "${TTS_SPEED:-1.0}"
      TTS_TIMEOUT_SECONDS: "${TTS_TIMEOUT_SECONDS:-60}"
      VISION_ENABLED: "${VISION_ENABLED:-false}"
      VISION_API_BASE_URL: "${VISION_API_BASE_URL:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_MODEL: "${VISION_MODEL:-}"
      VISION_TIMEOUT_SECONDS: "${VISION_TIMEOUT_SECONDS:-30}"
      VISION_MAX_IMAGE_DIMENSION: "${VISION_MAX_IMAGE_DIMENSION:-1024}"
      VISION_JPEG_QUALITY: "${VISION_JPEG_QUALITY:-85}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - frontend-internal
      - backend-isolated
      - egress-api
    restart: unless-stopped

  indexer:
    image: ghcr.io/smart-living-copilot/copilot:latest
    env_file: .env
    command: ["python", "-m", "copilot.indexer.main"]
    environment:
      REDIS_URL: "redis://valkey:6379"
      THING_EVENTS_STREAM: "${THING_EVENTS_STREAM:-thing_events}"
      REGISTRY_DATABASE_URL: "${REGISTRY_DATABASE_URL:-postgresql://copilot:copilot@postgres:5432/copilot}"
      SEARCH_VECTOR_DIMENSIONS: "${SEARCH_VECTOR_DIMENSIONS:-1024}"
      SEARCH_INDEXER_EVENTS_GROUP: "${SEARCH_INDEXER_EVENTS_GROUP:-thing_search_indexer}"
      SEARCH_INDEXER_POLL_BLOCK_MS: "${SEARCH_INDEXER_POLL_BLOCK_MS:-5000}"
      SEARCH_INDEXER_BATCH_SIZE: "${SEARCH_INDEXER_BATCH_SIZE:-20}"
      SEARCH_INDEXER_CLAIM_IDLE_MS: "${SEARCH_INDEXER_CLAIM_IDLE_MS:-60000}"
      SEARCH_INDEXER_RETRY_SECONDS: "${SEARCH_INDEXER_RETRY_SECONDS:-5}"
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL}"
      OPENAI_EMBEDDING_API_BASE_URL: "${OPENAI_EMBEDDING_API_BASE_URL:-}"
      OPENAI_EMBEDDING_API_KEY: "${OPENAI_EMBEDDING_API_KEY:-}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-mxbai-embed-large}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend-isolated
      - egress-api
    restart: unless-stopped

  chat-ui:
    image: ghcr.io/smart-living-copilot/chat-ui:latest
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8123"
      COPILOT_URL: "http://copilot:8123"
      CODE_EXECUTOR_URL: "http://code-executor:8888"
      JOB_RUNNER_URL: "http://copilot:8123"
      WOT_API_URL: "http://copilot:8123/api"
      WOT_REGISTRY_TOKEN: "${INIT_ADMIN_TOKEN}"
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
    depends_on:
      copilot:
        condition: service_started
    networks:
      - frontend-internal
      - backend-isolated
    restart: unless-stopped

  code-executor:
    image: ghcr.io/smart-living-copilot/code-executor:latest
    init: true
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=100M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
          pids: 64
    networks:
      - backend-isolated
    environment:
      IDLE_TIMEOUT_SECONDS: "1800"
      MAX_SESSIONS: "50"
      LOG_LEVEL: "INFO"
      WOT_REGISTRY_URL: "http://copilot:8123"
      WOT_REGISTRY_TOKEN: "${INIT_ADMIN_TOKEN}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-isolated
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-copilot}"
      POSTGRES_USER: "${POSTGRES_USER:-copilot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-copilot}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend-isolated
    restart: unless-stopped

  wot-runtime:
    image: ghcr.io/smart-living-copilot/wot-runtime:latest
    depends_on:
      valkey:
        condition: service_healthy
      copilot:
        condition: service_healthy
    networks:
      - backend-isolated
      - egress-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      HOST: "0.0.0.0"
      PORT: "3003"
      REDIS_URL: redis://valkey:6379
      REGISTRY_URL: http://copilot:8123
      WOT_RUNTIME_REGISTRY_TOKEN: ${WOT_RUNTIME_REGISTRY_TOKEN}
      WOT_RUNTIME_API_TOKEN: ${WOT_RUNTIME_API_TOKEN}
      WOT_RUNTIME_STREAM: ${WOT_RUNTIME_STREAM:-wot_runtime_events}
      WOT_SUBSCRIPTION_SETUP_TIMEOUT_MS: ${WOT_SUBSCRIPTION_SETUP_TIMEOUT_MS:-0}

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles:
      - tts
    ports:
      - "8880:8880"
    networks:
      - backend-isolated
      - egress-api
    restart: unless-stopped

volumes:
  copilot-data:
  postgres-data:
  valkey-data:

networks:
  frontend-internal:
  backend-isolated:
    internal: true
  egress-api:
